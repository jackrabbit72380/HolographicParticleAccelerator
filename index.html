<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Jackrabbit72380">
    <title>Holographic Particle Accelerator</title>
    <link rel="stylesheet" type="text/css" href="src/controller.css?v=20261116j">
    <link rel="stylesheet" type="text/css" href="src/style.css?v=20261116j">
    <link rel="stylesheet" type="text/css" href="src/mobile.css?v=20261116j">
  </head>

  <body>

    <!-- Render target -->
    <canvas id="canvas"></canvas>

    <!-- Caption overlay, revealed once the image has assembled -->
    <div id="caption">Holographic Particle Accelerator</div>

    <!-- Boot status, hidden on first frame -->
    <div id="loading">Assembling</div>

    <!-- The controller, docked down the right-hand side. Home moves it. -->
    <aside id="dock" class="dock" aria-hidden="true" aria-label="Controller">
      <div class="dock-bar">
        <span id="status" class="status" role="status">ready</span>
        <button id="reset" class="ghost" type="button">Reset</button>
      </div>
      <div class="wrap" id="wrap">
        <!-- controller.js binds these; there is no second window here, so they stay hidden -->
        <div hidden>
          <button id="open-player" type="button">Open particle window</button>
          <button id="focus-player" type="button">Bring to front</button>
          <button id="close-player" type="button">Close</button>
          <p class="note" id="connection"></p>
        </div>
        <div id="sections"></div>
      </div>
    </aside>

    <div id="dock-hint" role="button" tabindex="0">Home — controls</div>

    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

    <!-- Turn, tumble and roll as on/off switches; wraps the model matrix before the engine draws -->
    <script src="src/axes.js?v=20261116j"></script>

    <!-- The canvas box follows the same pixels the engine measures, so nothing stretches -->
    <script src="src/canvas-fit.js?v=20261116j"></script>

    <!-- Engine, shapes included -->
    <script src="src/engine.js?v=20261116j"></script>

    <!-- The blob target: a sphere the music deforms -->
    <script src="src/blob.js?v=20261116j"></script>

    <!-- Keeps the controller window attached if it is reloaded -->
    <script src="src/relay.js?v=20261116j"></script>

    <!-- HPA.reset(): puts the shipped settings back -->
    <script src="src/reset.js?v=20261116j"></script>

    <!-- HPA.show(): inside spin, visualizer and rainbow autopilot -->
    <script src="src/show.js?v=20261116j"></script>

    <!-- HPA.exportModel(): the assembled target as a downloadable model -->
    <script src="src/export.js?v=20261116j"></script>

    <!-- HPA.importModel(): a Blender mesh (OBJ / PLY) as the target -->
    <script src="src/import.js?v=20261116j"></script>

    <!-- Docks the panel into this window; runs before controller.js, which needs it -->
    <script src="src/dock.js?v=20261116j"></script>

    <!-- Where the panel sits: right, left, top, bottom, or its own window -->
    <script src="src/placement.js?v=20261116j"></script>

    <!-- Close guide, as a single × in the bar -->
    <script src="src/close-x.js?v=20261116j"></script>

    <!-- The whole control panel -->
    <script src="src/controller.js?v=20261116j"></script>

    <!-- The 90 degree fix for models that arrive Z-up; needs the Target section above it -->
    <script src="src/model-tilt.js?v=20261116j"></script>

    <!-- One panel per layer, behind the Layers dropdown -->
    <script src="src/layers.js?v=20261116j"></script>

    <!-- One Load… for pictures and meshes, in place of two buttons -->
    <script src="src/target-load.js?v=20261116j"></script>

    <!-- Caption from the track, picture or model you loaded -->
    <script src="src/caption-names.js?v=20261116j"></script>

    <!-- Runs last: the notes live in an info card at each section's pill -->
    <script src="src/panel-compact.js?v=20261116j"></script>

    <!-- Short capture labels, in two rows -->
    <script src="src/panel-copy.js?v=20261116j"></script>

    <!-- Capture keeps WebM and MP4 with one video length; Export has the model files -->
    <script src="src/capture-set.js?v=20261116j"></script>

    <!-- Capture: record the whole build from its first frame -->
    <script src="src/record-start.js?v=20261116j"></script>

    <!-- A starfield as a source for either layer, with its own controls -->
    <script src="src/starfield.js?v=20261116j"></script>

    <!-- Reverse: build up, turn three times, dissolve out, start over -->
    <script src="src/reverse.js?v=20261116j"></script>

    <!-- The Show options as four on/off switches -->
    <script src="src/show-switches.js?v=20261116j"></script>

    <!-- The build id at the bottom right of the panel -->
    <script src="src/build.js?v=20261116j"></script>

  </body>

</html>
