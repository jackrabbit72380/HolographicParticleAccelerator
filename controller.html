<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Jackrabbit72380">
    <meta name="theme-color" content="#05070a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305070a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%238fd8ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%238fd8ff'/%3E%3C/svg%3E">
    <title>Holographic Particle Accelerator Controller</title>
    <link rel="stylesheet" type="text/css" href="src/controller.css?v=20261116l">
    <link rel="stylesheet" type="text/css" href="src/mobile.css?v=20261116l">
  </head>

  <body>

    <header class="bar">
      <div class="brand">
        <span class="led" aria-hidden="true"></span>
        <h1>Holographic Particle Accelerator <em>Controller</em></h1>
      </div>
      <div class="bar-actions">
        <span id="status" class="status" role="status">not connected</span>
        <button id="reset" class="ghost" type="button">Reset</button>
        <a class="ghost" href="index.html" target="_blank" rel="noopener">Open player tab ↗</a>
      </div>
    </header>

    <main class="wrap" id="wrap">

      <section class="section">
        <h2>Particle window</h2>
        <div class="buttons">
          <button id="open-player" type="button">Open particle window</button>
          <button id="focus-player" type="button">Bring to front</button>
          <button id="close-player" type="button">Close</button>
        </div>
        <p class="note" id="connection">Not connected. The particle window opens separately and this panel drives it.</p>
      </section>

      <div id="sections"></div>

    </main>

    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

    <!-- Opened from a particle window: drive the animation that opened it -->
    <script src="src/attached.js?v=20261116l"></script>

    <script src="src/controller.js?v=20261116l"></script>

    <!-- The Layers panel and the Blob target, beside the controller -->
    <script src="src/layers.js?v=20261116l"></script>

    <!-- One Load… for pictures and meshes, as in the particle window -->
    <script src="src/target-load.js?v=20261116l"></script>

    <!-- WebM and MP4 with one length, and the model files under Export -->
    <script src="src/capture-set.js?v=20261116l"></script>

    <!-- The notes of every section live behind its "i" pill, never under the controls -->
    <script src="src/panel-compact.js?v=20261116l"></script>

    <!-- The same for this window's own section, above the panel -->
    <script src="src/guide-notes.js?v=20261116l"></script>

    <!-- Close guide, a single ×, top right of this window's own bar -->
    <script src="src/guide-close.js?v=20261116l"></script>

    <!-- The build id at the bottom right of the panel -->
    <script src="src/build.js?v=20261116l"></script>

  </body>

</html>
